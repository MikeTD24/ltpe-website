name: Publier le site LTPE
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_run:
    workflows: [Synchroniser les vidéos YouTube]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
      - name: Préparer les seuls fichiers publics
        run: |
          mkdir -p _site
          cp index.html about.html teachings.html _site/
          cp -R css js images data _site/
          rm -f _site/images/Homepage.png _site/images/Aboutpage.png _site/images/Teachingspage.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
